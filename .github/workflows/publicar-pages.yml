# Compila la app Ionic/Angular y la publica en GitHub Pages en cada push a main.
# Requiere las variables del repositorio SUPABASE_URL y SUPABASE_KEY (clave pública).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: node scripts/configurar-supabase.mjs

      - name: Compilar
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          npx ng build --base-href "$BASE"
          # GitHub Pages responde 404.html en rutas internas (/app/...): es la misma app.
          cp www/browser/index.html www/browser/404.html
          touch www/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/www/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
