# Supabase (plan gratuito) pausa los proyectos tras 7 días sin uso.
# Este flujo consulta la API cada 3 días para mantenerlo activo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar research_api
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Falta la variable SUPABASE_URL"; exit 1; fi
          AUTH=""
          if [[ "$SUPABASE_KEY" == eyJ* ]]; then AUTH="Authorization: Bearer $SUPABASE_KEY"; fi
          curl -sS --fail -X POST "$SUPABASE_URL/rest/v1/rpc/research_api" \
            -H "apikey: $SUPABASE_KEY" ${AUTH:+-H "$AUTH"} -H "Content-Type: application/json" \
            -d '{"ruta":"api/health.php","metodo":"GET","datos":{},"token":null}'
